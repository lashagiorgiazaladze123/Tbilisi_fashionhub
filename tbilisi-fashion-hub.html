<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBILISI FASHION HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F9F8F6;
    --ink:#111111;
    --line:#E5E5E5;
    --accent:#C85A32;
    --tag:#F3EFE9;
    --muted:#767267;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans Georgian','Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body.lang-en{ font-family:'Inter','Noto Sans Georgian',sans-serif; }

  .num{ font-family:'Space Grotesk',monospace; }

  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  /* ============ ANNOUNCEMENT BAR ============ */
  .announce{
    background:var(--ink);
    color:var(--bg);
    text-align:center;
    font-size:11px;
    letter-spacing:0.08em;
    padding:9px 16px;
    font-family:'Space Grotesk',monospace;
    text-transform:uppercase;
  }

  /* ============ NAVBAR ============ */
  .navbar{
    position:sticky; top:0; z-index:50;
    background:rgba(249,248,246,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
  }
  .logo{
    font-family:'Space Grotesk',monospace;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.02em;
    display:flex; align-items:center; gap:6px;
  }
  .logo .slash{ color:var(--accent); }
  .nav-links{
    display:none;
    gap:28px;
    font-size:13px;
    font-weight:500;
  }
  .nav-links a{
    position:relative;
    padding-bottom:2px;
  }
  .nav-links a:hover{ color:var(--accent); }
  .nav-right{
    display:flex; align-items:center; gap:14px;
  }
  .lang-toggle{
    display:flex;
    border:1px solid var(--ink);
    border-radius:20px;
    overflow:hidden;
    font-family:'Space Grotesk',monospace;
    font-size:11px;
    font-weight:600;
  }
  .lang-toggle button{
    padding:6px 12px;
    transition:.15s;
  }
  .lang-toggle button.active{
    background:var(--ink);
    color:var(--bg);
  }
  .btn-insta{
    display:none;
    background:var(--ink);
    color:var(--bg);
    padding:9px 16px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.01em;
    white-space:nowrap;
  }
  .btn-insta:hover{ background:var(--accent); }

  @media(min-width:860px){
    .nav-links{ display:flex; }
    .btn-insta{ display:inline-block; }
  }

  /* ============ HERO ============ */
  .hero{
    padding:64px 24px 48px;
    max-width:920px;
    margin:0 auto;
    text-align:left;
  }
  .hero-eyebrow{
    font-family:'Space Grotesk',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:18px;
    display:flex; align-items:center; gap:8px;
  }
  .hero-eyebrow::before{
    content:"";
    width:16px; height:1px;
    background:var(--accent);
  }
  .hero h1{
    font-size:clamp(30px,6vw,54px);
    line-height:1.08;
    font-weight:700;
    letter-spacing:-0.01em;
    max-width:14ch;
  }
  body.lang-en .hero h1{ font-weight:800; text-transform:uppercase; letter-spacing:-0.01em;}
  .hero p{
    margin-top:20px;
    font-size:16px;
    color:var(--muted);
    max-width:44ch;
    line-height:1.6;
  }
  .hero-ctas{
    display:flex; flex-wrap:wrap; gap:12px;
    margin-top:32px;
  }
  .btn-primary{
    background:var(--ink);
    color:var(--bg);
    padding:14px 26px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.01em;
    transition:.15s;
  }
  .btn-primary:hover{ background:var(--accent); }
  .btn-outline{
    border:1px solid var(--ink);
    padding:14px 26px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
  }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }

  .stitch{
    border:none;
    border-top:2px dashed var(--line);
    margin:0 24px;
  }

  /* ============ CATALOG ============ */
  .catalog{
    max-width:1180px;
    margin:0 auto;
    padding:56px 24px 20px;
  }
  .catalog-head{
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
    margin-bottom:8px;
  }
  .catalog-title{
    font-size:26px;
    font-weight:700;
  }
  .catalog-count{
    font-family:'Space Grotesk',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .filters{
    display:flex; gap:8px; flex-wrap:wrap;
    margin:22px 0 36px;
  }
  .filter-btn{
    border:1px solid var(--line);
    background:#fff;
    padding:8px 16px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    transition:.15s;
  }
  .filter-btn:hover{ border-color:var(--ink); }
  .filter-btn.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(1,1fr);
    gap:22px;
  }
  @media(min-width:640px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media(min-width:960px){ .grid{ grid-template-columns:repeat(3,1fr); } }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:visible;
    position:relative;
    display:flex; flex-direction:column;
    transition:.2s;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(17,17,17,0.06); }

  .card-media{
    aspect-ratio:1/1.05;
    border-radius:4px 4px 0 0;
    overflow:hidden;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .card-media img{
    width:100%; height:100%; object-fit:cover;
  }
  .card-media svg{ width:52%; height:52%; }

  .badge{
    position:absolute; top:10px; left:10px;
    background:var(--accent);
    color:#fff;
    font-family:'Space Grotesk',monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.06em;
    padding:5px 9px;
    border-radius:3px;
    z-index:2;
  }

  /* swing tag - signature element */
  .swingtag{
    position:absolute;
    top:-10px; right:14px;
    background:var(--tag);
    border:1px solid var(--ink);
    border-radius:3px;
    padding:5px 9px 5px 14px;
    font-family:'Space Grotesk',monospace;
    font-size:10px;
    font-weight:600;
    transform:rotate(5deg);
    z-index:3;
    box-shadow:1px 2px 0 rgba(17,17,17,0.08);
  }
  .swingtag::before{
    content:"";
    position:absolute; left:5px; top:50%;
    width:4px; height:4px;
    border:1px solid var(--ink);
    border-radius:50%;
    background:var(--bg);
    transform:translateY(-50%);
  }

  .card-body{
    padding:16px 16px 18px;
    display:flex; flex-direction:column; gap:6px;
    flex:1;
  }
  .card-cat{
    font-family:'Space Grotesk',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .card-title{
    font-size:15px;
    font-weight:600;
    line-height:1.35;
    min-height:2.7em;
  }
  .card-bottom{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:8px;
  }
  .card-price{
    font-family:'Space Grotesk',monospace;
    font-weight:700;
    font-size:16px;
  }
  .card-size{
    font-family:'Space Grotesk',monospace;
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:3px;
    padding:2px 6px;
  }
  .card-cta{
    margin-top:12px;
    border:1px solid var(--ink);
    border-radius:5px;
    padding:10px;
    text-align:center;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.01em;
    transition:.15s;
  }
  .card-cta:hover{
    background:var(--ink);
    color:var(--bg);
  }

  /* ============ TRUST SECTION ============ */
  .trust{
    max-width:1180px;
    margin:70px auto 20px;
    padding:0 24px;
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
  }
  @media(min-width:768px){ .trust{ grid-template-columns:repeat(3,1fr); } }
  .trust-block{
    border:1px solid var(--line);
    background:#fff;
    border-radius:4px;
    padding:24px;
  }
  .trust-icon{
    width:34px; height:34px;
    margin-bottom:14px;
  }
  .trust-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:6px;
  }
  .trust-desc{
    font-size:13px;
    color:var(--muted);
    line-height:1.55;
  }

  /* ============ FOOTER ============ */
  footer{
    margin-top:80px;
    border-top:1px solid var(--line);
    padding:36px 24px 28px;
  }
  .footer-inner{
    max-width:1180px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:18px;
  }
  .footer-social{
    display:flex; gap:16px;
    font-size:13px; font-weight:600;
  }
  .footer-social a:hover{ color:var(--accent); }
  .footer-whatsapp{
    background:var(--ink);
    color:var(--bg);
    padding:10px 18px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
  }
  .footer-whatsapp:hover{ background:var(--accent); }
  .footer-copy{
    width:100%;
    font-size:11px;
    color:var(--muted);
    margin-top:18px;
    font-family:'Space Grotesk',monospace;
  }

  /* ============ MODAL ============ */
  .overlay{
    position:fixed; inset:0;
    background:rgba(17,17,17,0.5);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    padding:0;
  }
  .overlay.open{ display:flex; }
  @media(min-width:640px){ .overlay{ align-items:center; padding:24px; } }

  .modal{
    background:#fff;
    width:100%;
    max-width:520px;
    max-height:92vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:22px;
    position:relative;
  }
  @media(min-width:640px){ .modal{ border-radius:10px; } }

  .modal-close{
    position:absolute; top:16px; right:16px;
    width:30px; height:30px;
    border:1px solid var(--line);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    z-index:2;
  }
  .modal-close:hover{ background:var(--ink); color:var(--bg); }

  .modal-media{
    width:100%;
    aspect-ratio:1/0.85;
    border-radius:8px;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:18px;
  }
  .modal-media img{ width:100%; height:100%; object-fit:cover; }
  .modal-media svg{ width:44%; height:44%; }

  .modal-cat{
    font-family:'Space Grotesk',monospace;
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted);
  }
  .modal-title{
    font-size:20px; font-weight:700; margin:4px 0 10px;
  }
  .modal-price{
    font-family:'Space Grotesk',monospace;
    font-weight:700; font-size:20px;
    color:var(--accent);
    margin-bottom:16px;
  }

  .measure-title{
    font-family:'Space Grotesk',monospace;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .measure-grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:20px;
  }
  .measure-item{
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 8px;
    text-align:center;
    background:var(--tag);
  }
  .measure-val{
    font-family:'Space Grotesk',monospace;
    font-weight:700; font-size:17px;
  }
  .measure-label{
    font-size:10px; color:var(--muted); margin-top:4px;
    letter-spacing:0.02em;
  }
  .modal-condition{
    font-size:13px; color:var(--muted); line-height:1.6;
    margin-bottom:20px;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }
  .modal-actions{ display:flex; flex-direction:column; gap:10px; }
  .modal-btn{
    padding:13px; border-radius:6px; text-align:center;
    font-size:13px; font-weight:600;
  }
  .modal-btn.insta{ background:var(--ink); color:var(--bg); }
  .modal-btn.insta:hover{ background:var(--accent); }
  .modal-btn.wa{ border:1px solid var(--ink); }
  .modal-btn.wa:hover{ border-color:var(--accent); color:var(--accent); }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- ANNOUNCEMENT BAR -->
<div class="announce">
  <span class="i18n" data-ka="უფასო მიწოდება თბილისის მასშტაბით • ექსკლუზიური შეზღუდული კოლექცია" data-en="FREE LOCAL DELIVERY IN TBILISI • EXCLUSIVE LIMITED DROPS"></span>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo"><span>TBILISI</span><span class="slash">/</span><span>FASHION HUB</span></div>
  <ul class="nav-links">
    <li><a href="#catalog" class="i18n" data-ka="კატალოგი" data-en="Catalog"></a></li>
    <li><a href="#about" class="i18n" data-ka="ჩვენს შესახებ" data-en="About"></a></li>

    <a class="btn-insta" href="https://instagram.com/direct/t/" target="_blank" rel="noopener">
      <span class="i18n" data-ka="ინსტაგრამზე მიწერა" data-en="DM on Instagram"></span>

</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-eyebrow"><span class="i18n" data-ka="DROP 01 — ᲗᲑᲘᲚᲘᲡᲘ" data-en="DROP 01 — TBILISI"></span></div>
  <h1 class="i18n" data-ka="შერჩეული რეტრო და ქუჩის სტილის კოლექცია." data-en="CURATED RETRO & STREETWEAR DROPS."></h1>
  <p class="i18n" data-ka="უნიკალური 1-of-1 ტანსაცმელი და ელემენტარული ბაზისი. ყველა ნივთი შემოწმებული, გაწმენდილი და ზუსტად გაზომილი." data-en="1-of-1 unique pieces and elevated essentials. Every item checked, cleaned, and measured to the centimeter."></p>
  <div class="hero-ctas">
    <a href="#catalog" class="btn-primary i18n" data-ka="კოლექციის ნახვა" data-en="View Drop"></a>
    <a href="#howto" class="btn-outline i18n" data-ka="როგორ შევუკვეთო" data-en="How to Order"></a>

<hr class="stitch">

<!-- CATALOG -->

  <div class="filters" id="filters"></div>
  <div class="grid" id="product-grid"></div>
</section>

<!-- TRUST -->
<section class="trust" id="howto">

    <svg class="trust-icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4"><path d="M4 3v18M20 3v18M4 8h4M4 13h6M4 18h3M16 8h4M14 13h6M17 18h3"/></svg>
    <div class="trust-title i18n" data-ka="ზუსტი ზომები" data-en="Exact Sizing"></div>

  </div>
  <div class="trust-block">

    <div class="trust-desc i18n" data-ka="შეკვეთა ჩამოვა იმავე დღეს ან 24 საათში — თბილისის ნებისმიერ უბანში." data-en="Same-day or 24h delivery, anywhere in Tbilisi."></div>
  </div>

    <div class="trust-desc i18n" data-ka="ყველა ნივთი გასუფთავებული, შემოწმებული და მზადაა ტარებისთვის." data-en="Every piece prepped, cleaned, and ready to wear."></div>
  </div>
</section>

<!-- FOOTER -->
<footer id="about">
  <div class="footer-inner">
    <div class="logo"><span>TBILISI</span><span class="slash">/</span><span>FASHION HUB</span></div>
    <div class="footer-social">
      <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>

      <span class="i18n" data-ka="WhatsApp-ით მიწერა" data-en="Message on WhatsApp"></span>
    </a>
    <div class="footer-copy">© 2026 TBILISI FASHION HUB. <span class="i18n" data-ka="ყველა უფლება დაცულია." data-en="All rights reserved."></span></div>
  </div>
</footer>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-media" id="modal-media"></div>
    <div class="modal-cat" id="modal-cat"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-price" id="modal-price"></div>
    <div class="measure-title i18n" data-ka="ზუსტი ზომები (სმ)" data-en="Exact Measurements (cm)"></div>
    <div class="measure-grid">
      <div class="measure-item">
        <div class="measure-val" id="m-chest"></div>
        <div class="measure-label i18n" data-ka="მკერდი" data-en="Chest"></div>
      </div>
      <div class="measure-item">
        <div class="measure-val" id="m-length"></div>
        <div class="measure-label i18n" data-ka="სიგრძე" data-en="Length"></div>
      </div>
      <div class="measure-item">
        <div class="measure-val" id="m-waist"></div>
        <div class="measure-label i18n" data-ka="წელი" data-en="Waist"></div>
      </div>
    </div>

const FILTERS = [
  {key:"all", ka:"ყველა", en:"All"},
  {key:"denim", ka:"ჯინსი", en:"Denim"},
  {key:"outerwear", ka:"ქურთუკები", en:"Outerwear"},
  {key:"tops", ka:"მაისურები", en:"Tops"},
  {key:"belts", ka:"ქამრები", en:"Belts"},
  {key:"shoes", ka:"ფეხსაცმელი", en:"Shoes"}
];

let LANG = "ka";
let ACTIVE_FILTER = "all";

function setLang(lang){
  LANG = lang;
  document.body.classList.toggle("lang-en", lang === "en");
  document.getElementById("btn-ka").classList.toggle("active", lang==="ka");
  document.getElementById("btn-en").classList.toggle("active", lang==="en");
  document.querySelectorAll(".i18n").forEach(el=>{
    el.textContent = lang === "ka" ? el.dataset.ka : el.dataset.en;
  });
  renderGrid();
}

function renderFilters(){
  const wrap = document.getElementById("filters");
  wrap.innerHTML = "";
  FILTERS.forEach(f=>{
    const b = document.createElement("button");
    b.className = "filter-btn" + (ACTIVE_FILTER===f.key ? " active" : "");
    b.textContent = LANG === "ka" ? f.ka : f.en;
    b.onclick = ()=>{ ACTIVE_FILTER = f.key; renderFilters(); renderGrid(); };
    wrap.appendChild(b);
  });
}

function renderGrid(){
  renderFilters();
  const grid = document.getElementById("product-grid");
  grid.innerHTML = "";
  const items = PRODUCTS.filter(p => ACTIVE_FILTER === "all" || p.cat === ACTIVE_FILTER);
  document.getElementById("prod-count").textContent = items.length;

  items.forEach(p=>{
    const card = document.createElement("div");
    card.className = "card";

    const badgeText = p.badge === "1of1"
      ? (LANG==="ka" ? "1 ᲘᲖ 1" : "1 OF 1")
      : (LANG==="ka" ? "ᲐᲮᲐᲚᲘ" : "NEW");

    const media = PHOTOS[p.id]
      ? `<img src="${PHOTOS[p.id]}" alt="${p.en}">`
      : ICONS[p.icon];

    card.innerHTML = `
      <div class="card-media" onclick="openModal(${p.id})">
        <span class="badge">${badgeText}</span>
        ${media}
      </div>
      <div class="swingtag">${p.size}</div>
      <div class="card-body">
        <div class="card-cat">${LANG==="ka" ? (FILTERS.find(f=>f.key===p.cat)||{}).ka : (FILTERS.find(f=>f.key===p.cat)||{}).en}</div>
        <div class="card-title">${LANG==="ka" ? p.ka : p.en}</div>
        <div class="card-bottom">
          <div class="card-price">${p.price} ₾</div>
          <div class="card-size">${p.size}</div>
        </div>
        <button class="card-cta" onclick="openModal(${p.id})">${LANG==="ka" ? "დაჯავშნა DM-ით" : "Reserve via DM"}</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function openModal(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;

  document.getElementById("modal-media").innerHTML = PHOTOS[p.id]
    ? `<img src="${PHOTOS[p.id]}" alt="${p.en}">`
    : ICONS[p.icon];

  document.getElementById("modal-cat").textContent = LANG==="ka" ? (FILTERS.find(f=>f.key===p.cat)||{}).ka : (FILTERS.find(f=>f.key===p.cat)||{}).en;
  document.getElementById("modal-title").textContent = LANG==="ka" ? p.ka : p.en;
  document.getElementById("modal-price").textContent = p.price + " ₾  ·  " + p.size;
  document.getElementById("m-chest").textContent = p.chest;
  document.getElementById("m-length").textContent = p.length;
  document.getElementById("m-waist").textContent = p.waist;
  document.getElementById("modal-condition").textContent = LANG==="ka" ? p.condK : p.condE;

  const itemName = LANG==="ka" ? p.ka : p.en;
  const msg = encodeURIComponent(
    (LANG==="ka" ? "გამარჯობა! მაინტერესებს: " : "Hi! I'm interested in: ") + itemName + " (" + p.size + ", " + p.price + "₾)"
  );
  document.getElementById("modal-insta").href = "https://ig.me/m/yourhandle?text=" + msg;
  document.getElementById("modal-wa").href = "https://wa.me/995000000000?text=" + msg;

  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}

document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* init */
renderGrid();
</script>
</body>
</html>
