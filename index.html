<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBILISI FASHION HUB</title>
<meta name="description" content="Curated retro & streetwear drops in Tbilisi. 1-of-1 pieces and elevated essentials, checked, cleaned and measured to the centimeter.">

<!-- Social sharing -->
<meta property="og:title" content="TBILISI FASHION HUB">
<meta property="og:description" content="Curated retro & streetwear drops in Tbilisi.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23111111%22/><text x=%2250%22 y=%2266%22 font-size=%2260%22 fill=%22%23C85A32%22 text-anchor=%22middle%22 font-family=%22monospace%22>/</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 :root {
  --bg: #F9F8F6;       /* Soft Off-White Background */
  --ink: #111111;      /* Charcoal/Near-Black Text & Primary Buttons */
  --line: #E5E5E5;     /* Light Gray Borders & Dividers */
  --accent: #C85A32;   /* Terracotta / Burnt Orange Accent */
  --tag: #F3EFE9;      /* Light Sand Neutral Tag & Card Media Background */
  --muted: #767267;    /* Warm Gray Secondary Text */
}
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans Georgian','Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    opacity:0;
    transition:opacity .12s ease;
  }
  body.ready{ opacity:1; }
  body.lang-en{ font-family:'Inter','Noto Sans Georgian',sans-serif; }

  .num{ font-family:'Space Grotesk',monospace; }

  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

  /* ============ ANNOUNCEMENT BAR ============ */
  .announce{
    background:var(--ink);
    color:var(--bg);
    text-align:center;
    font-size:11px;
    letter-spacing:0.08em;
    padding:9px 16px;
    font-family:'Space Grotesk',monospace;
    text-transform:uppercase;
  }

  /* ============ NAVBAR ============ */
  .navbar{
    position:sticky; top:0; z-index:50;
    background:rgba(249,248,246,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
  }
  .logo{
    font-family:'Space Grotesk',monospace;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.02em;
    display:flex; align-items:center; gap:6px;
  }
  .logo .slash{ color:var(--accent); }
  .nav-links{
    display:none;
    gap:28px;
    font-size:13px;
    font-weight:500;
  }
  .nav-links a{
    position:relative;
    padding-bottom:2px;
  }
  .nav-links a:hover{ color:var(--accent); }
  .nav-right{
    display:flex; align-items:center; gap:14px;
  }
  .lang-toggle{
    display:flex;
    border:1px solid var(--ink);
    border-radius:20px;
    overflow:hidden;
    font-family:'Space Grotesk',monospace;
    font-size:11px;
    font-weight:600;
  }
  .lang-toggle button{
    padding:6px 12px;
    transition:.15s;
  }
  .lang-toggle button.active{
    background:var(--ink);
    color:var(--bg);
  }
  .btn-insta{
    display:none;
    background:var(--ink);
    color:var(--bg);
    padding:9px 16px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.01em;
    white-space:nowrap;
  }
  .btn-insta:hover{ background:var(--accent); }

  @media(min-width:860px){
    .nav-links{ display:flex; }
    .btn-insta{ display:inline-block; }
  }

  /* ============ HERO ============ */
  .hero{
    padding:64px 24px 48px;
    max-width:920px;
    margin:0 auto;
    text-align:left;
  }
  .hero-eyebrow{
    font-family:'Space Grotesk',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:18px;
    display:flex; align-items:center; gap:8px;
  }
  .hero-eyebrow::before{
    content:"";
    width:16px; height:1px;
    background:var(--accent);
  }
  .hero h1{
    font-size:clamp(30px,6vw,54px);
    line-height:1.08;
    font-weight:700;
    letter-spacing:-0.01em;
    max-width:14ch;
  }
  body.lang-en .hero h1{ font-weight:800; text-transform:uppercase; letter-spacing:-0.01em;}
  .hero p{
    margin-top:20px;
    font-size:16px;
    color:var(--muted);
    max-width:44ch;
    line-height:1.6;
  }
  .hero-ctas{
    display:flex; flex-wrap:wrap; gap:12px;
    margin-top:32px;
  }
  .btn-primary{
    background:var(--ink);
    color:var(--bg);
    padding:14px 26px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.01em;
    transition:.15s;
  }
  .btn-primary:hover{ background:var(--accent); }
  .btn-outline{
    border:1px solid var(--ink);
    padding:14px 26px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
  }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }

  .stitch{
    border:none;
    border-top:2px dashed var(--line);
    margin:0 24px;
  }

  /* ============ CATALOG ============ */
  .catalog{
    max-width:1180px;
    margin:0 auto;
    padding:56px 24px 20px;
  }
  .catalog-head{
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
    margin-bottom:8px;
  }
  .catalog-title{
    font-size:26px;
    font-weight:700;
  }
  .catalog-count{
    font-family:'Space Grotesk',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .filters{
    display:flex; gap:8px; flex-wrap:wrap;
    margin:22px 0 36px;
  }
  .filter-btn{
    border:1px solid var(--line);
    background:#fff;
    padding:8px 16px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    transition:.15s;
  }
  .filter-btn:hover{ border-color:var(--ink); }
  .filter-btn.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(1,1fr);
    gap:22px;
  }
  @media(min-width:640px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media(min-width:960px){ .grid{ grid-template-columns:repeat(3,1fr); } }

  .state-msg{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    grid-column:1/-1;
  }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:visible;
    position:relative;
    display:flex; flex-direction:column;
    transition:.2s;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(17,17,17,0.06); }
  .card.is-sold{ opacity:0.6; }

  .card-media{
    aspect-ratio:1/1.05;
    border-radius:4px 4px 0 0;
    overflow:hidden;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    background:var(--tag);
  }
  .card-media img{
    width:100%; height:100%; object-fit:cover;
  }
  .card-media svg{ width:52%; height:52%; }

  .badge{
    position:absolute; top:10px; left:10px;
    background:var(--accent);
    color:#fff;
    font-family:'Space Grotesk',monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.06em;
    padding:5px 9px;
    border-radius:3px;
    z-index:2;
  }
  .badge.sold{ background:var(--ink); }

  /* swing tag - signature element */
  .swingtag{
    position:absolute;
    top:-10px; right:14px;
    background:var(--tag);
    border:1px solid var(--ink);
    border-radius:3px;
    padding:5px 9px 5px 14px;
    font-family:'Space Grotesk',monospace;
    font-size:10px;
    font-weight:600;
    transform:rotate(5deg);
    z-index:3;
    box-shadow:1px 2px 0 rgba(17,17,17,0.08);
  }
  .swingtag::before{
    content:"";
    position:absolute; left:5px; top:50%;
    width:4px; height:4px;
    border:1px solid var(--ink);
    border-radius:50%;
    background:var(--bg);
    transform:translateY(-50%);
  }

  .card-body{
    padding:16px 16px 18px;
    display:flex; flex-direction:column; gap:6px;
    flex:1;
  }
  .card-cat{
    font-family:'Space Grotesk',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .card-title{
    font-size:15px;
    font-weight:600;
    line-height:1.35;
    min-height:2.7em;
  }
  .card-bottom{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:8px;
  }
  .card-price{
    font-family:'Space Grotesk',monospace;
    font-weight:700;
    font-size:16px;
  }
  .card-size{
    font-family:'Space Grotesk',monospace;
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:3px;
    padding:2px 6px;
  }
  .card-cta{
    margin-top:12px;
    border:1px solid var(--ink);
    border-radius:5px;
    padding:10px;
    text-align:center;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.01em;
    transition:.15s;
  }
  .card-cta:hover{
    background:var(--ink);
    color:var(--bg);
  }
  .card-cta:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }

  /* ============ TRUST SECTION ============ */
  .trust{
    max-width:1180px;
    margin:70px auto 20px;
    padding:0 24px;
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
  }
  @media(min-width:768px){ .trust{ grid-template-columns:repeat(3,1fr); } }
  .trust-block{
    border:1px solid var(--line);
    background:#fff;
    border-radius:4px;
    padding:24px;
  }
  .trust-icon{
    width:34px; height:34px;
    margin-bottom:14px;
  }
  .trust-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:6px;
  }
  .trust-desc{
    font-size:13px;
    color:var(--muted);
    line-height:1.55;
  }

  /* ============ FOOTER ============ */
  footer{
    margin-top:80px;
    border-top:1px solid var(--line);
    padding:36px 24px 28px;
  }
  .footer-inner{
    max-width:1180px; margin:0 auto;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:18px;
  }
  .footer-social{
    display:flex; gap:16px;
    font-size:13px; font-weight:600;
  }
  .footer-social a:hover{ color:var(--accent); }
  .footer-whatsapp{
    background:var(--ink);
    color:var(--bg);
    padding:10px 18px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
  }
  .footer-whatsapp:hover{ background:var(--accent); }
  .footer-copy{
    width:100%;
    font-size:11px;
    color:var(--muted);
    margin-top:18px;
    font-family:'Space Grotesk',monospace;
  }
  .footer-admin{
    font-size:11px;
    color:var(--muted);
    font-family:'Space Grotesk',monospace;
  }
  .footer-admin:hover{ color:var(--accent); }

  /* ============ MODAL ============ */
  .overlay{
    position:fixed; inset:0;
    background:rgba(17,17,17,0.5);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    padding:0;
  }
  .overlay.open{ display:flex; }
  @media(min-width:640px){ .overlay{ align-items:center; padding:24px; } }

  .modal{
    background:#fff;
    width:100%;
    max-width:520px;
    max-height:92vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:22px;
    position:relative;
  }
  @media(min-width:640px){ .modal{ border-radius:10px; } }

  .modal-close{
    position:absolute; top:16px; right:16px;
    width:30px; height:30px;
    border:1px solid var(--line);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    z-index:2;
    background:#fff;
  }
  .modal-close:hover{ background:var(--ink); color:var(--bg); }

  .modal-media{
    width:100%;
    aspect-ratio:1/0.85;
    border-radius:8px;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:18px;
    background:var(--tag);
  }
  .modal-media img{ width:100%; height:100%; object-fit:cover; }
  .modal-media svg{ width:44%; height:44%; }

  .modal-cat{
    font-family:'Space Grotesk',monospace;
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted);
  }
  .modal-title{
    font-size:20px; font-weight:700; margin:4px 0 10px;
  }
  .modal-price{
    font-family:'Space Grotesk',monospace;
    font-weight:700; font-size:20px;
    color:var(--accent);
    margin-bottom:16px;
  }

  .measure-title{
    font-family:'Space Grotesk',monospace;
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .measure-grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:20px;
  }
  .measure-item{
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 8px;
    text-align:center;
    background:var(--tag);
  }
  .measure-val{
    font-family:'Space Grotesk',monospace;
    font-weight:700; font-size:17px;
  }
  .measure-label{
    font-size:10px; color:var(--muted); margin-top:4px;
    letter-spacing:0.02em;
  }
  .modal-condition{
    font-size:13px; color:var(--muted); line-height:1.6;
    margin-bottom:20px;
    border-top:1px dashed var(--line);
    padding-top:14px;
  }
  .modal-actions{ display:flex; flex-direction:column; gap:10px; }
  .modal-btn{
    padding:13px; border-radius:6px; text-align:center;
    font-size:13px; font-weight:600;
  }
  .modal-btn.insta{ background:var(--ink); color:var(--bg); }
  .modal-btn.insta:hover{ background:var(--accent); }
  .modal-btn.wa{ border:1px solid var(--ink); }
  .modal-btn.wa:hover{ border-color:var(--accent); color:var(--accent); }
  .modal-sold-note{
    font-size:12px; color:var(--muted); text-align:center; padding:10px;
    border:1px dashed var(--line); border-radius:6px;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- ANNOUNCEMENT BAR -->
<div class="announce">
  <span class="i18n" data-ka="უფასო მიწოდება თბილისის მასშტაბით • ექსკლუზიური შეზღუდული კოლექცია" data-en="FREE LOCAL DELIVERY IN TBILISI • EXCLUSIVE LIMITED DROPS"></span>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo"><span>TBILISI</span><span class="slash">/</span><span>FASHION HUB</span></div>
  <ul class="nav-links">
    <li><a href="#catalog" class="i18n" data-ka="კატალოგი" data-en="Catalog"></a></li>
    <li><a href="#about" class="i18n" data-ka="ჩვენს შესახებ" data-en="About"></a></li>
    <li><a href="#howto" class="i18n" data-ka="როგორ შევუკვეთოთ" data-en="How it Works"></a></li>

  <div class="nav-right">
    <div class="lang-toggle">
      <button id="btn-ka" class="active" onclick="setLang('ka')">KA</button>

    </div>
    <a class="btn-insta" id="nav-insta" target="_blank" rel="noopener">
      <span class="i18n" data-ka="ინსტაგრამზე მიწერა" data-en="DM on Instagram"></span>
    </a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-eyebrow"><span class="i18n" data-ka="DROP 01 — ᲗᲑᲘᲚᲘᲡᲘ" data-en="DROP 01 — TBILISI"></span></div>
  <h1 class="i18n" data-ka="შერჩეული რეტრო და ქუჩის სტილის კოლექცია." data-en="CURATED RETRO & STREETWEAR DROPS."></h1>
  <p class="i18n" data-ka="უნიკალური 1-of-1 ტანსაცმელი და ელემენტარული ბაზისი. ყველა ნივთი შემოწმებული, გაწმენდილი და ზუსტად გაზომილი." data-en="1-of-1 unique pieces and elevated essentials. Every item checked, cleaned, and measured to the centimeter."></p>
  <div class="hero-ctas">
    <a href="#catalog" class="btn-primary i18n" data-ka="კოლექციის ნახვა" data-en="View Drop"></a>
    <a href="#howto" class="btn-outline i18n" data-ka="როგორ შევუკვეთო" data-en="How to Order"></a>
  </div>
</section>

<hr class="stitch">

<!-- CATALOG -->
<section class="catalog" id="catalog">
  <div class="catalog-head">
    <div class="catalog-title i18n" data-ka="კატალოგი — Drop 01" data-en="Catalog — Drop 01"></div>
    <div class="catalog-count"><span id="prod-count">0</span> <span class="i18n" data-ka="ნივთი" data-en="items"></span></div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="grid" id="product-grid"></div>
</section>

<!-- TRUST -->
<section class="trust" id="howto">
  <div class="trust-block">
    <svg class="trust-icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4"><path d="M4 3v18M20 3v18M4 8h4M4 13h6M4 18h3M16 8h4M14 13h6M17 18h3"/></svg>
    <div class="trust-title i18n" data-ka="ზუსტი ზომები" data-en="Exact Sizing"></div>
    <div class="trust-desc i18n" data-ka="მკერდი, სიგრძე და წელი — ყველა ნივთი გაზომილია სანტიმეტრებში, სანდო ონლაინ შერჩევისთვის." data-en="Chest, length & waist — every item measured in centimeters for reliable online sizing."></div>
  </div>
  <div class="trust-block">
    <svg class="trust-icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4"><path d="M3 12h11l-3-3m3 3-3 3"/><path d="M14 6h3l3 4v6h-2"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
    <div class="trust-title i18n" data-ka="სწრაფი მიწოდება" data-en="Fast Tbilisi Delivery"></div>
    <div class="trust-desc i18n" data-ka="შეკვეთა ჩამოვა იმავე დღეს ან 24 საათში — თბილისის ნებისმიერ უბანში." data-en="Same-day or 24h delivery, anywhere in Tbilisi."></div>
  </div>
  <div class="trust-block">
    <svg class="trust-icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.4"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-4.5"/></svg>
    <div class="trust-title i18n" data-ka="ხარისხის გარანტია" data-en="Checked Quality"></div>
    <div class="trust-desc i18n" data-ka="ყველა ნივთი გასუფთავებული, შემოწმებული და მზადაა ტარებისთვის." data-en="Every piece prepped, cleaned, and ready to wear."></div>
  </div>
</section>

<!-- FOOTER -->
<footer id="about">
  <div class="footer-inner">
    <div class="logo"><span>TBILISI</span><span class="slash">/</span><span>FASHION HUB</span></div>
    <div class="footer-social">
      <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
      <a href="https://tiktok.com" target="_blank" rel="noopener">TikTok</a>
      <a class="footer-admin" href="admin.html">Admin</a>
    </div>
    <a class="footer-whatsapp" id="footer-wa" target="_blank" rel="noopener">
      <span class="i18n" data-ka="WhatsApp-ით მიწერა" data-en="Message on WhatsApp"></span>
    </a>
    <div class="footer-copy">© 2026 TBILISI FASHION HUB. <span class="i18n" data-ka="ყველა უფლება დაცულია." data-en="All rights reserved."></span></div>
  </div>
</footer>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-media" id="modal-media"></div>
    <div class="modal-cat" id="modal-cat"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-price" id="modal-price"></div>
    <div class="measure-title i18n" data-ka="ზუსტი ზომები (სმ)" data-en="Exact Measurements (cm)"></div>
    <div class="measure-grid">
      <div class="measure-item">
        <div class="measure-val" id="m-chest"></div>
        <div class="measure-label i18n" data-ka="მკერდი" data-en="Chest"></div>
      </div>
      <div class="measure-item">
        <div class="measure-val" id="m-length"></div>
        <div class="measure-label i18n" data-ka="სიგრძე" data-en="Length"></div>
      </div>
      <div class="measure-item">
        <div class="measure-val" id="m-waist"></div>
        <div class="measure-label i18n" data-ka="წელი" data-en="Waist"></div>
      </div>
    </div>
    <div class="modal-condition" id="modal-condition"></div>
    <div class="modal-actions" id="modal-actions">
      <a class="modal-btn insta" id="modal-insta" target="_blank" rel="noopener">
        <span class="i18n" data-ka="დაჯავშნა Instagram-ზე" data-en="Reserve on Instagram"></span>
      </a>
      <a class="modal-btn wa" id="modal-wa" target="_blank" rel="noopener">
        <span class="i18n" data-ka="დაჯავშნა WhatsApp-ზე" data-en="Reserve on WhatsApp"></span>
      </a>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ ICONS (fallback when a product has no photo yet) ============ */
const ICONS = {
  jeans: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3"><path d="M7 2h10l.6 6-1.1 13.5a1 1 0 0 1-1 .9h-1a1 1 0 0 1-1-.9L12 12l-1.5 9.6a1 1 0 0 1-1 .9h-1a1 1 0 0 1-1-.9L6.4 8 7 2Z"/><path d="M7 2c1.2 1 3 1 5 1s3.8 0 5-1M9 8h6M8.3 13h2.4M13.3 13h2.4"/></svg>`,
  shorts: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3"><path d="M5 3h14l.7 8-1 9.4a.9.9 0 0 1-.9.8h-1.4a.9.9 0 0 1-.9-.8L14.5 13l-1 7.4a.9.9 0 0 1-.9.8H11.2a.9.9 0 0 1-.9-.8L9.3 13l-1 7.4a.9.9 0 0 1-.9.8H5.9a.9.9 0 0 1-.9-.8L4 11 5 3Z"/><path d="M5.3 8.5h13.6"/></svg>`,
  jacket: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3"><path d="M8 4 4 6.5 5.5 11 7 9.5V21h10V9.5L18.5 11 20 6.5 16 4l-2 2h-4L8 4Z"/><path d="M12 6v15M9 4l.5 3M15 4l-.5 3"/></svg>`,
  shirt: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3"><path d="M9 3 5 5.5 6.2 9 8 7.7V21h8V7.7L17.8 9 19 5.5 15 3l-1.6 1.6a2 2 0 0 1-2.8 0L9 3Z"/><circle cx="12" cy="10" r=".4" fill="#111"/><circle cx="12" cy="14" r=".4" fill="#111"/><circle cx="12" cy="18" r=".4" fill="#111"/></svg>`,
  polo: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3"><path d="M9 3 5 5.5 6.2 9 8 7.7V21h8V7.7L17.8 9 19 5.5 15 3l-1 1.2c-1 1.2-3 1.2-4 0L9 3Z"/><path d="M10.5 4.6 12 6l1.5-1.4M11 5v3h2V5"/></svg>`,
  belt: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3"><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="9.5" y="8" width="5" height="8" rx="1"/><circle cx="12" cy="12" r="1" fill="#111"/><path d="M3 11.3h4M17 11.3h4M3 12.7h4M17 12.7h4"/></svg>`,
  boot: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3"><path d="M9 2v9.5c0 1-.4 2-1.2 2.7L4 17.7A2 2 0 0 0 3 19.4V20a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-4.2c0-2 .8-3.8 2.2-5.2L18 8.2c1-1 1.5-2.3 1.5-3.7V2"/><path d="M9 2h9M9 6h9"/></svg>`,
  sneaker: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3"><path d="M2 17.5c0-1.4.9-2 2-2.4l4.2-1.6c.9-.3 1.5-1.1 1.7-2l.4-2c.1-.7.8-1.1 1.4-.8l3.6 1.8c1.6.8 3.4 1.3 5.2 1.3H21c.6 0 1 .4 1 1v3c0 1.1-.9 2-2 2H3c-.6 0-1-.4-1-1v-1Z"/><path d="M2 17.5h20M8 12.8l3 1.5M11.3 11.3l3 1.7"/></svg>`,
  photo: `<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.3"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>`
};

const FILTERS = [
  {key:"all", ka:"ყველა", en:"All"},
  {key:"denim", ka:"ჯინსი", en:"Denim"},
  {key:"outerwear", ka:"ქურთუკები", en:"Outerwear"},
  {key:"tops", ka:"მაისურები", en:"Tops"},
  {key:"belts", ka:"ქამრები", en:"Belts"},
  {key:"shoes", ka:"ფეხსაცმელი", en:"Shoes"}
];

let LANG = "ka";
let ACTIVE_FILTER = "all";
let PRODUCTS = [];
let LOAD_STATE = "loading"; // loading | ready | error

// Contact links come from config.js so the owner only edits one place
document.getElementById("nav-insta").href = "https://ig.me/m/" + CONTACT.instagramHandle;
document.getElementById("footer-wa").href = "https://wa.me/" + CONTACT.whatsappNumber;

let supabaseClient = null;
try {
  if (SUPABASE_URL && SUPABASE_URL.indexOf("YOUR_SUPABASE") === -1) {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) { /* supabase-js failed to load, handled below */ }

async function loadProducts(){
  if (!supabaseClient) {
    LOAD_STATE = "error";
    renderGrid();
    return;
  }
  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: false });

  if (error) {
    LOAD_STATE = "error";
  } else {
    PRODUCTS = data;
    LOAD_STATE = "ready";
  }
  renderGrid();
}

function setLang(lang){
  LANG = lang;
  document.body.classList.add("ready"); // <-- Add this line
  document.body.classList.toggle("lang-en", lang === "en");
  document.getElementById("btn-ka").classList.toggle("active", lang==="ka");
  document.getElementById("btn-en").classList.toggle("active", lang==="en");
  document.querySelectorAll(".i18n").forEach(el=>{
    el.textContent = lang === "ka" ? el.dataset.ka : el.dataset.en;
  });
  renderGrid();
}

function renderFilters(){
  const wrap = document.getElementById("filters");
  wrap.innerHTML = "";
  FILTERS.forEach(f=>{
    const b = document.createElement("button");
    b.className = "filter-btn" + (ACTIVE_FILTER===f.key ? " active" : "");
    b.textContent = LANG === "ka" ? f.ka : f.en;
    b.onclick = ()=>{ ACTIVE_FILTER = f.key; renderFilters(); renderGrid(); };
    wrap.appendChild(b);
  });
}

function renderGrid(){
  renderFilters();
  const grid = document.getElementById("product-grid");
  grid.innerHTML = "";

  if (LOAD_STATE === "loading") {
    grid.innerHTML = `<div class="state-msg">${LANG==="ka" ? "იტვირთება..." : "Loading..."}</div>`;
    document.getElementById("prod-count").textContent = 0;
    return;
  }
  if (LOAD_STATE === "error") {
    grid.innerHTML = `<div class="state-msg">${LANG==="ka"
      ? "კატალოგის ჩატვირთვა ვერ მოხერხდა. სცადეთ მოგვიანებით ან დაუკავშირდით ინსტაგრამზე."
      : "Couldn't load the catalog. Try again later, or reach out on Instagram."}</div>`;
    document.getElementById("prod-count").textContent = 0;
    return;
  }

  const items = PRODUCTS.filter(p => ACTIVE_FILTER === "all" || p.cat === ACTIVE_FILTER);
  document.getElementById("prod-count").textContent = items.length;

  if (items.length === 0) {
    grid.innerHTML = `<div class="state-msg">${LANG==="ka" ? "ამ კატეგორიაში ნივთები ჯერ არ არის." : "No items in this category yet."}</div>`;
    return;
  }

  items.forEach(p=>{
    const card = document.createElement("div");
    card.className = "card" + (p.sold ? " is-sold" : "");

    const badgeText = p.sold
      ? (LANG==="ka" ? "გაყიდულია" : "SOLD")
      : p.badge === "1of1"
        ? (LANG==="ka" ? "1 ᲘᲖ 1" : "1 OF 1")
        : p.badge === "new"
          ? (LANG==="ka" ? "ᲐᲮᲐᲚᲘ" : "NEW")
          : "";

    const media = p.image_url
      ? `<img src="${p.image_url}" alt="${p.name_en}" loading="lazy">`
      : (ICONS[p.icon] || ICONS.photo);

    card.innerHTML = `
      <div class="card-media" onclick="openModal('${p.id}')">
        ${badgeText ? `<span class="badge ${p.sold?'sold':''}">${badgeText}</span>` : ""}
        ${media}
      </div>
      <div class="swingtag">${p.size || ""}</div>
      <div class="card-body">
        <div class="card-cat">${LANG==="ka" ? (FILTERS.find(f=>f.key===p.cat)||{}).ka || p.cat : (FILTERS.find(f=>f.key===p.cat)||{}).en || p.cat}</div>
        <div class="card-title">${LANG==="ka" ? p.name_ka : p.name_en}</div>
        <div class="card-bottom">
          <div class="card-price">${p.price} ₾</div>
          <div class="card-size">${p.size || ""}</div>
        </div>
        <button class="card-cta" onclick="openModal('${p.id}')" ${p.sold ? "disabled" : ""}>${
          p.sold
            ? (LANG==="ka" ? "გაყიდულია" : "Sold")
            : (LANG==="ka" ? "დაჯავშნა DM-ით" : "Reserve via DM")
        }</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function openModal(id){
  const p = PRODUCTS.find(x=>String(x.id)===String(id));
  if(!p) return;

  document.getElementById("modal-media").innerHTML = p.image_url
    ? `<img src="${p.image_url}" alt="${p.name_en}">`
    : (ICONS[p.icon] || ICONS.photo);

  document.getElementById("modal-cat").textContent = LANG==="ka" ? (FILTERS.find(f=>f.key===p.cat)||{}).ka || p.cat : (FILTERS.find(f=>f.key===p.cat)||{}).en || p.cat;
  document.getElementById("modal-title").textContent = LANG==="ka" ? p.name_ka : p.name_en;
  document.getElementById("modal-price").textContent = p.price + " ₾  ·  " + (p.size || "");
  document.getElementById("m-chest").textContent = p.chest || "—";
  document.getElementById("m-length").textContent = p.length || "—";
  document.getElementById("m-waist").textContent = p.waist || "—";
  document.getElementById("modal-condition").textContent = LANG==="ka" ? p.cond_ka : p.cond_en;

  const actions = document.getElementById("modal-actions");
  if (p.sold) {
    actions.innerHTML = `<div class="modal-sold-note">${LANG==="ka" ? "ეს ნივთი უკვე გაყიდულია." : "This item has already sold."}</div>`;
  } else {
    const itemName = LANG==="ka" ? p.name_ka : p.name_en;
    const msg = encodeURIComponent(
      (LANG==="ka" ? "გამარჯობა! მაინტერესებს: " : "Hi! I'm interested in: ") + itemName + " (" + p.size + ", " + p.price + "₾)"
    );
    actions.innerHTML = `
      <a class="modal-btn insta" id="modal-insta" target="_blank" rel="noopener" href="https://ig.me/m/${CONTACT.instagramHandle}?text=${msg}">
        <span>${LANG==="ka" ? "დაჯავშნა Instagram-ზე" : "Reserve on Instagram"}</span>
      </a>
      <a class="modal-btn wa" id="modal-wa" target="_blank" rel="noopener" href="https://wa.me/${CONTACT.whatsappNumber}?text=${msg}">
        <span>${LANG==="ka" ? "დაჯავშნა WhatsApp-ზე" : "Reserve on WhatsApp"}</span>
      </a>
    `;
  }

  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}

document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* init */
setLang("ka");
loadProducts();
</script>
</body>
</html>
